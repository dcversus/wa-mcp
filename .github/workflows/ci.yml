name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: corepack (git deps build with their pinned package managers)
        run: |
          npm install -g corepack@latest
          corepack enable
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter @wa-mcp/shared build
          pnpm --filter @wa-mcp/mcp-server build
          pnpm --filter @wa-mcp/web-ui build
          pnpm --filter @wa-mcp/bridge build
      - run: pnpm exec vp check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: corepack (git deps build with their pinned package managers)
        run: |
          npm install -g corepack@latest
          corepack enable
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter @wa-mcp/shared build
          pnpm --filter @wa-mcp/mcp-server build
          pnpm --filter @wa-mcp/web-ui build
          pnpm --filter @wa-mcp/bridge build
          pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: corepack (git deps build with their pinned package managers)
        run: |
          npm install -g corepack@latest
          corepack enable
      - run: pnpm install --frozen-lockfile
      - name: dependency audit (fail on high+)
        run: pnpm audit --prod --audit-level high
      - name: gitleaks secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --redact -v
      - name: version-drift guard
        run: node scripts/version-drift.mjs
      - name: env var doc coverage
        run: pnpm run env-doc-coverage
      - name: tool doc coverage
        run: pnpm run docs:coverage

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: matrix.node == 26
      - uses: actions/setup-node@v4
        if: matrix.node == 26
        with:
          node-version: 26
          cache: pnpm
      - name: corepack (git deps build with their pinned package managers)
        if: matrix.os != 'windows-latest'
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: corepack (git deps build with their pinned package managers)
        if: matrix.os == 'windows-latest'
        run: |
          npm install -g corepack@latest
          corepack enable
      - name: vp test
        if: matrix.node == 26
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @wa-mcp/shared build
          pnpm --filter @wa-mcp/mcp-server build
          pnpm --filter @wa-mcp/web-ui build
          pnpm --filter @wa-mcp/bridge build
          pnpm exec vp test
      # T93-F: thresholds live in each package's vite.config.ts
      # (coverage.thresholds.lines: shared 90, bridge/mcp-server 80; dist/**
      # excluded). The gate script is package-scoped ON PURPOSE — a bare
      # workspace-root `vp test --coverage` matches no package config and
      # enforces NOTHING (reproduced: exit 0 at 74.75%).
      - name: coverage thresholds (bridge 80, mcp-server 80, shared 90 lines)
        if: matrix.node == 26
        run: |
          pnpm install --frozen-lockfile
          pnpm run coverage:gate
      - uses: actions/setup-node@v4
        if: matrix.node == 26
        with:
          node-version: 20
      - name: runtime smoke — download built dist
        if: matrix.node == 26
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      - name: runtime smoke — import built entries on node ${{ matrix.node }}
        if: matrix.node == 26
        run: node scripts/ci-smoke.mjs
