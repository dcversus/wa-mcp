name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter @wa-mcp/shared build
          pnpm --filter @wa-mcp/mcp-server build
      - run: pnpm exec vp check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter @wa-mcp/shared build
          pnpm --filter @wa-mcp/mcp-server build
          pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: dependency audit (fail on high+)
        run: pnpm audit --prod --audit-level high
      - name: gitleaks secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --redact -v
      - name: no-publish guard
        run: |
          ! grep -rEn "npm[ ]publish|pnpm[ ]publish|npmjs[.]org" --include="*.ts" --include="*.mjs" --include="*.yml" packages scripts .github/workflows
      - name: accounting census check
        run: vp run accounting:check

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: matrix.node == 22
      - uses: actions/setup-node@v4
        if: matrix.node == 22
        with:
          node-version: 22
          cache: pnpm
      - name: vp test
        if: matrix.node == 22
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @wa-mcp/shared build
          pnpm --filter @wa-mcp/mcp-server build
          pnpm exec vp test
      - uses: actions/setup-node@v4
        if: matrix.node == 20
        with:
          node-version: 20
      - name: runtime smoke — download built dist
        if: matrix.node == 20
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      - name: runtime smoke — import built entries on node ${{ matrix.node }}
        if: matrix.node == 20
        run: node scripts/ci-smoke.mjs
