name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter @wa-mcp/shared build
          pnpm --filter @wa-mcp/mcp-server build
          pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: matrix.node == 22
      - uses: actions/setup-node@v4
        if: matrix.node == 22
        with:
          node-version: 22
          cache: pnpm
      - name: vp test
        if: matrix.node == 22
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @wa-mcp/shared build
          pnpm --filter @wa-mcp/mcp-server build
          pnpm exec vp test
      - uses: actions/setup-node@v4
        if: matrix.node == 20
        with:
          node-version: 20
      - name: runtime smoke — download built dist
        if: matrix.node == 20
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      - name: runtime smoke — import built entries on node ${{ matrix.node }}
        if: matrix.node == 20
        run: node scripts/ci-smoke.mjs
